name: Optimize portfolio card images

on:
  push:
    paths:
      - '.github/workflows/optimize-card-images.yml'

permissions:
  contents: write

jobs:
  optimize-card-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Sharp
        run: npm install --no-save --no-package-lock sharp

      - name: Generate lightweight card images
        shell: bash
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');

          const jobs = [
            ['projetos/rs-top-team/img/1 Dashboras.webp', 'projetos/rs-top-team/img/card-1.webp', 68],
            ['projetos/rs-top-team/img/2 aluno.webp', 'projetos/rs-top-team/img/card-2.webp', 68],
            ['projetos/rs-top-team/img/3 Equipe .webp', 'projetos/rs-top-team/img/card-3.webp', 68],
            ['projetos/rs-top-team/img/4 chamda .webp', 'projetos/rs-top-team/img/card-4.webp', 68],
            ['projetos/rs-top-team/img/5 evento.webp', 'projetos/rs-top-team/img/card-5.webp', 68],
            ['projetos/rs-top-team/img/6 modalidade.webp', 'projetos/rs-top-team/img/card-6.webp', 68],
            ['projetos/mhouse-fit/img/Mhouse.webp', 'projetos/mhouse-fit/img/Mhouse-card.webp', 58],
            ['projetos/instagram-dm-downloader/img/DM downloader.webp', 'projetos/instagram-dm-downloader/img/DM-downloader-card.webp', 66],
            ['projetos/atlas-gestao/img/index-atlas.webp', 'projetos/atlas-gestao/img/index-atlas-card.webp', 58],
          ];

          (async () => {
            for (const [input, output, quality] of jobs) {
              if (!fs.existsSync(input)) {
                console.warn(`Skipping missing source: ${input}`);
                continue;
              }

              await sharp(input, { limitInputPixels: false })
                .resize({ width: 900, withoutEnlargement: true })
                .webp({ quality, effort: 6, smartSubsample: true })
                .toFile(output);

              const before = fs.statSync(input).size;
              const after = fs.statSync(output).size;
              const saved = before > 0 ? ((1 - after / before) * 100).toFixed(1) : '0';
              console.log(`${output}: ${(before / 1024).toFixed(0)} KB -> ${(after / 1024).toFixed(0)} KB (${saved}% menor)`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit optimized images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'projetos/rs-top-team/img/card-'*.webp \
            'projetos/mhouse-fit/img/Mhouse-card.webp' \
            'projetos/instagram-dm-downloader/img/DM-downloader-card.webp' \
            'projetos/atlas-gestao/img/index-atlas-card.webp'
          if git diff --cached --quiet; then
            echo "No generated image changes to commit."
            exit 0
          fi
          git commit -m "perf: gerar imagens leves para cards do portfólio"
          git push
